- name: Run macOS script
  ansible.builtin.script: macos.sh
  register: macos_script

- name: Report macOS script warnings
  ansible.builtin.debug:
    msg: "{{ macos_script.stderr_lines }}"
  when: macos_script.stderr_lines | default([]) | length > 0
